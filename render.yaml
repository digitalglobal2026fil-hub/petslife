services:
  - type: web
    name: petslife
    runtime: node
    buildCommand: curl -fsSL https://bun.sh/install | bash && export PATH="$HOME/.bun/bin:$PATH" && cd packages/web && bun install && bun run build
    startCommand: export PATH="$HOME/.bun/bin:$PATH" && cd packages/web && bun run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
